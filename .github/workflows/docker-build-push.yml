name: Docker Image Build and Push

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ecs-controller

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set image prefix
      run: echo "IMAGE_PREFIX=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push controller image
      uses: docker/build-push-action@v5
      with:
        context: ./
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ env.IMAGE_PREFIX }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.IMAGE_PREFIX }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        build-args: |
          ECS_VERSION=sha-${{ github.sha }}
          ECS_COMMIT=${{ github.sha }}
          ECS_BUILD_DATE=${{ github.event.head_commit.timestamp }}

    - name: Build and Push updater image
      uses: docker/build-push-action@v5
      with:
        context: ./
        file: ./docker/updater.Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ env.IMAGE_PREFIX }}/ecs-controller-updater:latest
          ${{ env.IMAGE_PREFIX }}/ecs-controller-updater:updater-sha-${{ github.sha }}
